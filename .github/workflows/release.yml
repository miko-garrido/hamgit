# release-please opens/updates a Release PR on pushes to main.
# Merging that PR tags vX.Y.Z and creates a GitHub Release; this workflow's
# publish job then builds macOS updater artifacts onto that release.
# workflow_dispatch rebuilds from the current branch without a version bump.
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY
# Optional: TAURI_SIGNING_PRIVATE_KEY_PASSWORD, APPLE_* signing/notarization secrets
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish-macos:
    needs: release-please
    if: >
      always() &&
      !failure() &&
      !cancelled() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: "--target aarch64-apple-darwin"
          - args: "--target x86_64-apple-darwin"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Add APPLE_* secrets only after you have a Developer ID cert.
          # Empty APPLE_CERTIFICATE breaks bundling (codesign import fails).
        with:
          tagName: ${{ needs.release-please.outputs.tag_name || 'v__VERSION__' }}
          releaseName: "Hamgit ${{ needs.release-please.outputs.tag_name || 'v__VERSION__' }}"
          releaseBody: "macOS build with auto-update support. See assets to download."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
